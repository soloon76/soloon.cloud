.user-menu {
  position: absolute;

  right: 0;

  box-shadow:

  transition: all 0.3s ease;
}

#userPhoto:hover {
  transform: scale(1.08);
}

<div id="userProfile" class="user-profile">
  <img id="userPhoto" src="" alt="프로필">

    <button id="logoutBtn">로그아웃</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // 🔥 Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyBJkZHrq88G6aCA6xdbW4SkbLj1JjKJ5jc",
    authDomain: "soloon-bbb26.firebaseapp.com",
    projectId: "soloon-bbb26",
    storageBucket: "soloon-bbb26.firebasestorage.app",
    messagingSenderId: "122401584098",
    appId: "1:122401584098:web:2181d68f54e64d2f6e7fbb"
  };


  // Firebase 시작
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();


  // HTML 요소
  const googleLoginBtn = document.getElementById("googleLoginBtn");

  const userProfile = document.getElementById("userProfile");
  const userPhoto = document.getElementById("userPhoto");

  const userMenu = document.getElementById("userMenu");
  const logoutBtn = document.getElementById("logoutBtn");


  // =========================
  // Google 로그인
  // =========================

  googleLoginBtn.addEventListener("click", async () => {

    try {

      const result = await signInWithPopup(auth, provider);

      const user = result.user;

      console.log("로그인 성공!");
      console.log("이름:", user.displayName);
      console.log("이메일:", user.email);

    } catch (error) {

      console.error("로그인 오류:", error);

      alert("로그인에 실패했습니다.");

    }

  });


  // =========================
  // 로그인 상태 확인
  // =========================

  onAuthStateChanged(auth, (user) => {

    if (user) {

      console.log("현재 로그인:", user.displayName);


      // 로그인 버튼 숨기기
      googleLoginBtn.style.display = "none";


      // 프로필 사진 표시
      userProfile.style.display = "block";

      userPhoto.src = user.photoURL;


    } else {

      console.log("로그아웃 상태");


      // 로그인 버튼 다시 표시
      googleLoginBtn.style.display = "";


      // 프로필 숨기기
      userProfile.style.display = "none";


      // 메뉴 닫기
      userMenu.classList.remove("show");

    }

  });


  // =========================
  // 프로필 사진 클릭
  // =========================

  userPhoto.addEventListener("click", (event) => {

    event.stopPropagation();

    userMenu.classList.toggle("show");

  });


  // =========================
  // 로그아웃
  // =========================

  logoutBtn.addEventListener("click", async () => {

    try {

      await signOut(auth);

      console.log("로그아웃 완료");

    } catch (error) {

      console.error("로그아웃 오류:", error);

    }

  });


  // =========================
  // 화면 다른 곳 클릭하면 메뉴 닫기
  // =========================

  document.addEventListener("click", () => {

    userMenu.classList.remove("show");

  });

</script>
